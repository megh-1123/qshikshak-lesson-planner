name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Lesson Planner unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test results (Create / Submit / Approve)
          path: test-results/junit.xml
          reporter: java-junit
